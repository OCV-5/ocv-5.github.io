<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCV Travel has moved</title>

<!-- The map moved to www.ocvtravel.com on 2026-10-07.

     GitHub Pages cannot send a real 301, so this is the next best thing: the
     canonical link is what tells Google the page moved for good and hands the
     old URL's ranking to the new one, and the meta refresh moves anyone who
     lands here. location.replace() rather than location.href so the Back
     button returns where the visitor came from instead of bouncing them.

     404.html beside this file does the same for every other path. That is how
     the lowercase /ocvtravel-map/ link is caught: GitHub Pages paths are
     case-sensitive, so that spelling never matched a real folder and always
     fell through to 404.

     It is NOT a catch-all for the whole repo, deliberately. covers/ holds the
     Instagram thumbnails Step7c still points at -- 16 queued posts were using
     them when this was written -- and those are real files, so they keep being
     served and never reach this page. -->

<link rel="canonical" href="https://www.ocvtravel.com/">
<meta http-equiv="refresh" content="0; url=https://www.ocvtravel.com/">
<script>location.replace("https://www.ocvtravel.com/" + location.hash);</script>

<style>
  :root{--charcoal:#1E2730;--offwhite:#F5F1E8;--orange:#E8762C}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--charcoal);
       color:var(--offwhite);text-align:center;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--orange)}
  p{margin:0 0 10px}
  .small{font-size:13px;opacity:.65}
</style>
</head>
<body>
  <div>
    <p>The OCV Travel map now lives at
       <a href="https://www.ocvtravel.com/">www.ocvtravel.com</a>.</p>
    <p class="small">Taking you there now.</p>
  </div>
</body>
</html>
