<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacy — OCV Travel</title>

<!-- The privacy policy moved to www.ocvtravel.com/privacy on 2026-10-07.

     This file is a redirect, not the old policy. Restoring that would put a
     SECOND policy on the internet saying the tool collects nothing, which
     stopped being true when Google Analytics went on the public pages -- and
     two policies that disagree is worse than one.

     It has to exist, though. Google and Meta both had this exact URL on file,
     and without it the site's 404.html catches the path and sends people to
     the map instead, so a reviewer rechecking the old link would find no
     policy at all. This sends them to the real one. -->

<link rel="canonical" href="https://www.ocvtravel.com/privacy">
<meta http-equiv="refresh" content="0; url=https://www.ocvtravel.com/privacy">
<script>location.replace("https://www.ocvtravel.com/privacy");</script>

<style>
  :root{--charcoal:#1E2730;--offwhite:#F5F1E8;--orange:#E8762C}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--charcoal);
       color:var(--offwhite);text-align:center;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--orange)}
</style>
</head>
<body>
  <p>The privacy policy now lives at
     <a href="https://www.ocvtravel.com/privacy">www.ocvtravel.com/privacy</a>.</p>
</body>
</html>
